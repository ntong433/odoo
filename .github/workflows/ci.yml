name: LHI ERP CI

on:
  push:
    branches: [ "19.0", "main" ]
  pull_request:
    branches: [ "19.0", "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LHI Custom Lint Checks
        run: |
          python3 ./scripts/lint-checks.py

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: lhi_erp_test
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_db_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odoo/requirements.txt

      - name: Run Odoo Installation Tests
        env:
          POSTGRES_PASSWORD: odoo_db_password
        run: |
          python3 ./odoo/odoo-bin -c ./odoo.conf -d lhi_erp_test -i lhi_base,lhi_security,lhi_approval_matrix,lhi_audit,lhi_feature_control,lhi_web_shell,lhi_dashboard --stop-after-init --test-enable
