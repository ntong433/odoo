[options]
# Runtime deployments use scripts/start_odoo.sh, which generates a protected
# configuration from environment variables. Do not store database or Odoo
# administrator credentials in this source-controlled template.
addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO,odoo.addons.lhi_audit:DEBUG
proxy_mode = True
workers = 0
max_cron_threads = 2
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
